<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Formulário de Contato</title>
  <link rel="stylesheet" href="formulario.css">
</head>
<body>
  <div class="form-container">
    <form>
      <h2>Contato</h2>

      <label for="nome">Nome:</label>
      <input type="text" id="nome" name="nome" placeholder="Seu nome" required>

      <label for="email">E-mail:</label>
      <input type="email" id="email" name="email" placeholder="seu@exemplo.com" required>

      <label for="idade">Idade:</label>
      <input type="number" id="idade" name="idade" min="10" max="120" value="18" required>

      <label for="assunto">Assunto:</label>
      <select id="assunto" name="assunto">
        <option value="duvida">Duvida</option> 
        <option value="Sugestão">Sugestão</option>
        <option value="Outro">Outro</option>
      </select>

      <label for="mensagem">Mensagem:</label>
      <textarea id="mensagem" name="mensagem" placeholder="Escreva aqui..." rows="5" required></textarea>

      <div class="checkbox-container">
        <input type="checkbox" id="termos" name="termos" required>
        <label for="termos">Li e concordo com os termos</label>
      </div>

      <button type="submit">Enviar</button>
    </form>
  </div>
</body>
</html>
