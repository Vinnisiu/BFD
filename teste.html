<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Caixinha de Amor</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: pink;
      font-family: Arial, sans-serif;
    }
    .box {
      width: 200px;
      height: 200px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      cursor: pointer;
      transition: 0.4s;
    }
    .box:hover {
      transform: scale(1.05);
    }
    .heart {
      font-size: 50px;
      color: red;
      transition: 0.3s;
    }
    .message {
      position: absolute;
      text-align: center;
      opacity: 0;
      transition: 0.5s;
      padding: 10px;
      color: #d63384;
      font-weight: bold;
    }
    .box.open .heart {
      opacity: 0;
    }
    .box.open .message {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="box" onclick="openBox(this)">
    <div class="heart">❤️</div>
    <div class="message">Você é meu maior presente! 💕</div>
  </div>

  <script>
    function openBox(el) {
      el.classList.toggle("open");
    }
  </script>
</body>
</html>
